<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ПРУФ · аналитик</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">ПРУФ <span>признаки схем и повторные «пруфы»</span></div>
  <nav>
    <button class="tab active" data-view="queue">Очередь кейсов</button>
    <button class="tab" data-view="check">Проверить</button>
    <button class="tab" data-view="bank">Реквизиты</button>
  </nav>
  <div class="auth">
    <input id="token" type="password" placeholder="Токен аналитика" autocomplete="off">
  </div>
</header>
<div id="degraded" class="banner hidden"></div>
<div id="stats" class="stats"></div>

<main>
  <section id="view-queue" class="view">
    <aside class="queue">
      <div class="filters">
        <select id="f-level"><option value="">Любой риск</option><option value="high">Высокий</option><option value="medium">Средний</option></select>
        <select id="f-track"><option value="">Все треки</option><option value="lottery">Розыгрыши</option><option value="casino">Казино</option><option value="pyramid">Пирамиды</option></select>
        <select id="f-status"><option value="">Любой статус</option><option value="new">Новые</option><option value="in_review">В работе</option><option value="confirmed">Подтверждены</option><option value="dismissed">Отклонены</option></select>
      </div>
      <div id="cases-total" class="muted"></div>
      <ol id="cases" class="case-list"></ol>
    </aside>
    <article id="case" class="case-card"><p class="muted">Выберите кейс в очереди слева.</p></article>
  </section>

  <section id="view-check" class="view hidden">
    <form id="check-form" class="check">
      <textarea id="check-text" rows="6" placeholder="Текст поста, сообщение, расшифровка голосового (ru / kk / транслит)"></textarea>
      <div class="row">
        <input id="check-files" type="file" accept="image/jpeg,image/png,image/webp,audio/*" multiple>
        <input id="check-channel" placeholder="Канал / источник, например @channel">
        <label class="inline"><input id="check-store" type="checkbox" checked> сохранить в реестр</label>
        <button type="submit">Проверить</button>
      </div>
    </form>
    <div id="check-result"></div>
  </section>

  <section id="view-bank" class="view hidden">
    <p class="muted">Лента реквизитов, засвеченных в постах со средним и высоким риском (то же, что получает банк по API).</p>
    <table class="table"><thead><tr><th>Тип</th><th>Значение</th><th>Балл</th><th>Постов</th><th>Треки</th><th>Кейсы</th><th>Последний раз</th></tr></thead><tbody id="bank-rows"></tbody></table>
  </section>
</main>

<div id="modal" class="modal hidden"><div class="modal-body"><button class="close" id="modal-close">×</button><div id="modal-content"></div></div></div>
<script src="/static/app.js"></script>
</body>
</html>
