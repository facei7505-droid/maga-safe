<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ПРУФ Sentinel</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    body { width: 320px; padding: 14px 16px; }
    h1 { font-size: 16px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    .stat { background: var(--card); border-radius: 8px; padding: 8px; text-align: center; }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 11px; color: var(--muted); }
    label { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
    input { width: 100%; font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    details { margin-top: 10px; }
    #status { font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>ПРУФ Sentinel</h1>
  <div class="stats">
    <div class="stat"><b id="checked">0</b><span>постов проверено</span></div>
    <div class="stat"><b id="threats">0</b><span>угроз найдено</span></div>
    <div class="stat"><b id="blocked">0</b><span>сайтов остановлено</span></div>
    <div class="stat"><b id="copyWarnings">0</b><span>стопов при копировании</span></div>
    <div class="stat"><b id="reported">0</b><span>жалоб отправлено</span></div>
  </div>
  <div class="muted" id="blacklist">Чёрный список: ещё не загружен</div>
  <details>
    <summary>Подключение к серверу ПРУФ</summary>
    <label for="apiUrl">Адрес сервера</label>
    <input id="apiUrl" type="url" placeholder="http://127.0.0.1:8000">
    <label for="token">Токен расширения</label>
    <input id="token" type="password" autocomplete="off">
    <div class="row">
      <button class="primary" id="save" type="button">Сохранить</button>
      <button id="refresh" type="button">Обновить список</button>
    </div>
  </details>
  <div id="status" class="muted"></div>
  <script src="popup.js"></script>
</body>
</html>
