<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ПРУФ: опасный сайт</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    main { max-width: 560px; margin: 12vh auto; padding: 0 16px; }
    .sign { font-size: 44px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <div class="sign" aria-hidden="true">⚠</div>
    <h1>Этот сайт в чёрном списке ПРУФ</h1>
    <p>Домен <code id="domain">—</code> встречался в постах с признаками платных розыгрышей, казино или финансовых пирамид.</p>
    <p class="muted">Не вводите данные карты и не переводите деньги. Если сомневаетесь, проверьте организатора по официальным источникам.</p>
    <div class="actions">
      <button class="primary" id="back" type="button">Вернуться назад</button>
      <button id="proceed" type="button">Всё равно перейти</button>
    </div>
  </main>
  <script src="warning.js"></script>
</body>
</html>
